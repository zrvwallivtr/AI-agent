[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ollama",
  "pdfplumber",
  "requests",
  "rich",
  "chromadb",
  "tiktoken",
  "beautifulsoup4",
  "lxml",
  "openpyxl",
  "python-docx",
  "ebooklib",
  "docling>=2.120.1",
]

[project.scripts]
agent = "main:main"

[tool.setuptools]
py-modules = ["main"]

# Rest of the package code
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
